<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-label="Silver Surface chrome abstract hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="0.5" stop-color="#141416"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="50%" cy="0%" r="60%">
      <stop offset="0" stop-color="#a1a1a6" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#a1a1a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f7"/>
      <stop offset="0.25" stop-color="#d1d1d6"/>
      <stop offset="0.5" stop-color="#8e8e93"/>
      <stop offset="0.75" stop-color="#c7c7cc"/>
      <stop offset="1" stop-color="#e5e5ea"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#e5e5ea"/>
      <stop offset="0.55" stop-color="#a1a1a6"/>
      <stop offset="1" stop-color="#2c2c2e"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <rect width="1600" height="720" fill="url(#glowTop)"/>
  <!-- chrome horizon bars -->
  <g opacity="0.95">
    <rect x="180" y="300" width="1240" height="18" rx="9" fill="url(#bar)" opacity="0.9"/>
    <rect x="260" y="340" width="1080" height="54" rx="27" fill="none" stroke="url(#chrome)" stroke-width="2" opacity="0.8"/>
    <rect x="340" y="416" width="920" height="14" rx="7" fill="url(#bar)" opacity="0.6"/>
    <rect x="480" y="452" width="640" height="10" rx="5" fill="url(#bar)" opacity="0.35"/>
  </g>
  <!-- triangle brand mark -->
  <g transform="translate(800 210)">
    <path d="M0 -72 L78 68 H-78 Z" fill="none" stroke="url(#chrome)" stroke-width="3"/>
    <path d="M0 -72 L78 68 H-78 Z" fill="#f5f5f7" opacity="0.06"/>
  </g>
  <text x="800" y="580" text-anchor="middle" font-family="-apple-system, SF Pro Display, Inter, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.5" fill="#f5f5f7">SILVERSURFACE</text>
  <text x="800" y="620" text-anchor="middle" font-family="-apple-system, SF Pro Text, Inter, sans-serif" font-size="20" letter-spacing="4" fill="#86868b">SILVER SURFACE</text>
</svg>
